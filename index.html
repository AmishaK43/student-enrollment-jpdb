<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://login2explore.com/jpdb/resources/js/0.0.4/jpdb-commons.js"></script>
</head>

<body>

    <div class="container">
        <h1>Student Enrollment Form</h1>
        <p>Enter student details below</p>

        <form id="studentForm">

            <label>Roll Number</label>
            <input type="text" id="rollNo" placeholder="Enter Roll Number">

            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter Full Name" disabled>

            <label>Class</label>
            <input type="text" id="studentClass" placeholder="Enter Class" disabled>

            <label>Birth Date</label>
            <input type="date" id="birthDate" disabled>

            <label>Address</label>
            <textarea id="address" placeholder="Enter Address" disabled></textarea>

            <label>Enrollment Date</label>
            <input type="date" id="enrollmentDate" disabled>

            <div class="buttons">
                <button type="button" id="saveBtn" disabled>Save</button>
                <button type="button" id="updateBtn" disabled>Update</button>
                <button type="button" id="resetBtn" disabled>Reset</button>
            </div>

        </form>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
